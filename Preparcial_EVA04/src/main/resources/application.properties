spring.application.name=preparcial_security

# Puerto del servidor Spring Boot
server.port=8080

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/preparcial_security?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# THYMELEAF
spring.thymeleaf.cache=false

# Configuraciones adicionales recomendadas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false

# Límite de subida de archivos (2MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Para Tomcat: permitir que el conector acepte peticiones grandes si se desea (en bytes),
# dejar sin definir o ajustar según necesidades. Ejemplo para 10MB:
# server.tomcat.max-swallow-size=10485760

# Evitar que Tomcat restablezca la conexión por peticiones grandes: permitir que Spring maneje el error
# -1 significa ilimitado (dejar que Spring/Multipart gestione el tamaño real definido por `spring.servlet.multipart.*`)
server.tomcat.max-swallow-size=-1
# También puede ser útil permitir post de tamaño ilimitado en el conector
server.tomcat.max-http-post-size=-1