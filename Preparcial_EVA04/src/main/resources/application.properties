spring.application.name=preparcial_security

# Puerto del servidor Spring Boot
server.port=8080

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/dbspringboot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=AlumnosPV
spring.datasource.password=Prog.V2025

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# THYMELEAF
spring.thymeleaf.cache=false

# Configuraciones adicionales recomendadas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
server.error.whitelabel.enabled=false